<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>左上角角标 · 封面位置</title>
<link rel="stylesheet" href="../css/overlay.css">
<style>
  html, body { margin: 0; min-height: 100%; overflow: auto; }
  body {
    background: #14161b;
    color: #cfd3dc;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 26px 30px 40px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; letter-spacing: .4px; }
  .hint { font-size: 12px; color: #8b93a3; margin: 0 0 18px; }
  .bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 0 0 16px; padding: 12px 16px;
    background: #1b1e25; border: 1px solid #2a2f3a; border-radius: 12px;
  }
  .bar label { font-size: 12px; color: #aab2c2; min-width: 58px; }
  .bar input[type=range] { width: 240px; accent-color: #FF2D95; }
  .bar button {
    background: #232833; color: #cfd3dc; border: 1px solid #333a47;
    border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .bar button.on { background: #FF2D95; border-color: #FF2D95; color: #fff; }
  .val { font-size: 13px; color: #fff; min-width: 300px; }
  .val b { color: #FF2D95; }
  .stage {
    position: relative;
    width: 564px; height: 254px;
    border-radius: 18px;
    background: radial-gradient(120% 140% at 20% 0%, #23252d 0%, #15171c 55%, #0d0f13 100%);
    border: 1px solid #262a33;
    overflow: hidden;
  }
  .stage .badge { position: relative; left: 0; bottom: 0; top: 0; opacity: 1; transform: none; }
  .note { margin-top: 12px; font-size: 12px; color: #7f8797; }
  code { color: #aab2c2; }
</style>
</head>
<body>
<h1>左上角角标 · 封面位置</h1>
<p class="hint">文字锚点固定在 (64, 77)，只拖封面。当前定稿是 <code>(64, 75)</code>；纯镜像位是 <code>(74, 72)</code>。</p>

<div class="bar">
  <label>封面 X</label>
  <input id="cx" type="range" min="30" max="110" step="1" value="64">
  <label>封面 Y</label>
  <input id="cy" type="range" min="20" max="110" step="1" value="75">
  <button data-x="74" data-y="72">纯镜像 (74,72)</button>
  <button data-x="64" data-y="75">当前 (64,75)</button>
  <button data-x="54" data-y="88">再左下 (54,88)</button>
  <span class="val" id="val"></span>
</div>

<div class="stage" id="stage">
  <div class="badge tl on" id="badge"></div>
</div>
<p class="note">同一份演示数据、同一条进度（1:35 / 3:57）、同一套频谱形状；只改封面中心坐标。</p>

<script src="../js/palettes.js"></script>
<script src="../js/badge.js"></script>
<script>
  window.applyPalette('magenta');

  const data = {
    title: 'Mirairo Rider (Korean Ver.)',
    artist: '铁傲电台 · MSR',
    album: '',
    cover: '/cover.jpg'
  };
  const shape = Array.from({ length: window.Badge.BAR_COUNT }, (_, i) =>
    0.18 + 0.72 * Math.abs(Math.sin(i / 6.5)));
  const badge = document.getElementById('badge');
  const ix = document.getElementById('cx');
  const iy = document.getElementById('cy');
  const val = document.getElementById('val');

  function draw(x, y) {
    badge.innerHTML = window.Badge.render(data, 'tl', { cx: x, cy: y });
    const svg = badge.querySelector('svg');
    window.Badge.patch(svg, 95, 237, 'tl');
    window.Badge.setBars(svg, shape, 'tl');
    ix.value = x; iy.value = y;
    val.innerHTML = `封面 <b>(${x}, ${y})</b> · 文字 (64, 77) · 偏移 (${x - 74}, ${y - 72})`;
    document.querySelectorAll('[data-x]').forEach((b) =>
      b.classList.toggle('on', Number(b.dataset.x) === x && Number(b.dataset.y) === y));
  }

  ix.addEventListener('input', () => draw(Number(ix.value), Number(iy.value)));
  iy.addEventListener('input', () => draw(Number(ix.value), Number(iy.value)));
  document.querySelectorAll('[data-x]').forEach((b) =>
    b.addEventListener('click', () => draw(Number(b.dataset.x), Number(b.dataset.y))));
  draw(window.Badge.TL_COVER[0], window.Badge.TL_COVER[1]);
</script>
</body>
</html>
